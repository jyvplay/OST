<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fusion Shell TT27 "Daylight" wallpaper — original vector art (a soft light-blue bloom of translucent petals; not Microsoft's artwork), CC0 for this project. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f7fc"/><stop offset="1" stop-color="#d9e6f5"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".58" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0ff" stop-opacity=".95"/><stop offset="1" stop-color="#4a9df0" stop-opacity=".75"/></linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7ecff" stop-opacity=".9"/><stop offset="1" stop-color="#2f7fdc" stop-opacity=".7"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e9f4ff" stop-opacity=".9"/><stop offset="1" stop-color="#78b8f5" stop-opacity=".7"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>
  <g transform="translate(800 590)">
    <path d="M0 0C-120-60-210-220-170-360C-60-300 20-170 0 0Z" fill="url(#p2)"/>
    <path d="M0 0C120-60 210-220 170-360C60-300-20-170 0 0Z" fill="url(#p1)"/>
    <path d="M0 0C-180 10-380-60-460-190C-300-230-110-150 0 0Z" fill="url(#p3)"/>
    <path d="M0 0C180 10 380-60 460-190C300-230 110-150 0 0Z" fill="url(#p3)"/>
    <path d="M0 0C-140 90-360 120-520 60C-420-40-190-60 0 0Z" fill="url(#p1)" opacity=".85"/>
    <path d="M0 0C140 90 360 120 520 60C420-40 190-60 0 0Z" fill="url(#p2)" opacity=".85"/>
    <path d="M0 0C-40-120-30-300 0-420C30-300 40-120 0 0Z" fill="#ffffff" opacity=".75"/>
  </g>
</svg>
