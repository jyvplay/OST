    <path fill="#d0bcff" d="M0-230C40-230 52-200 86-208 118-198 128-166 160-160 182-136 172-102 198-82 210-50 190-22 204 12 200 46 172 62 168 98 150 126 116 128 98 158 64 172 36 154 0 170-36 154-64 172-98 158-116 128-150 126-168 98-172 62-200 46-204 12-190-22-210-50-198-82-172-102-182-136-160-160-128-166-118-198-86-208-52-200-40-230 0-230Z"/>
  </g>
