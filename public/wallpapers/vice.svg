<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fusion Shell TT22 "Vice sunset" wallpaper — original vector art, CC0 for this project. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12052a"/><stop offset=".38" stop-color="#3a0b5c"/><stop offset=".56" stop-color="#9c1d78"/><stop offset=".64" stop-color="#ff4d8d"/><stop offset=".66" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
