    <path d="M240 590c-60-36-150-30-210 20 70-26 140-26 210-20zM242 590c-30-60-100-96-190-90 80 20 140 50 190 90zM244 590c30-70 100-104 200-96-90 16-150 50-200 96zM244 592c80-16 160 10 220 80-70-40-150-66-220-80zM240 594c-70 4-140 50-170 120 40-60 100-100 170-120z"/>
