    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a4a"/><stop offset="1" stop-color="#0d0420"/>
    </linearGradient>
    <mask id="cuts">
      <rect width="1600" height="1000" fill="#fff"/>
      <g fill="#000"><rect x="0" y="470" width="1600" height="7"/><rect x="0" y="500" width="1600" height="10"/><rect x="0" y="532" width="1600" height="13"/><rect x="0" y="566" width="1600" height="16"/><rect x="0" y="600" width="1600" height="19"/></g>
    </mask>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff4d8d" stop-opacity=".55"/><stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7"><circle cx="160" cy="90" r="2"/><circle cx="420" cy="160" r="1.6"/><circle cx="700" cy="70" r="2.2"/><circle cx="980" cy="140" r="1.4"/><circle cx="1260" cy="60" r="2"/><circle cx="1480" cy="180" r="1.6"/><circle cx="300" cy="260" r="1.3"/><circle cx="1120" cy="250" r="1.5"/></g>
  <circle cx="800" cy="520" r="330" fill="url(#halo)"/>
  <circle cx="800" cy="520" r="210" fill="url(#sun)" mask="url(#cuts)"/>
