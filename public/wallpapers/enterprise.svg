    <radialGradient id="glow" cx=".72" cy=".38" r=".55"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".55"/><stop offset=".5" stop-color="#4c9be8" stop-opacity=".18"/><stop offset="1" stop-color="#4c9be8" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d33" stop-opacity="0"/><stop offset="1" stop-color="#0b1d33" stop-opacity=".55"/></linearGradient>
