<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fusion Shell TT23 "Liquid Glass" wallpaper — original vector art (after the iOS 26 design language), CC0 for this project. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b6e"/><stop offset=".45" stop-color="#1d4fbf"/><stop offset="1" stop-color="#0fb3c9"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".25" cy=".2" r=".5"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".75"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".8" r=".55"><stop offset="0" stop-color="#ffd60a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>
  <g>
    <circle cx="430" cy="380" r="250" fill="url(#lens)" stroke="url(#rim)" stroke-width="4"/>
    <path d="M260 270a230 230 0 0 1 200-120" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="10" stroke-linecap="round"/>
    <rect x="860" y="180" width="520" height="300" rx="150" fill="url(#lens)" stroke="url(#rim)" stroke-width="4"/>
    <path d="M940 230h300" stroke="#fff" stroke-opacity=".7" stroke-width="9" stroke-linecap="round"/>
    <circle cx="1120" cy="720" r="190" fill="url(#lens)" stroke="url(#rim)" stroke-width="4"/>
    <path d="M990 650a150 150 0 0 1 90-100" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="8" stroke-linecap="round"/>
    <rect x="300" y="700" width="420" height="180" rx="90" fill="url(#lens)" stroke="url(#rim)" stroke-width="3"/>
    <circle cx="1440" cy="560" r="70" fill="url(#lens)" stroke="url(#rim)" stroke-width="3"/>
    <circle cx="760" cy="560" r="46" fill="url(#lens)" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
